[tui.model_availability_nux]

[desktop]
agent-usage-reset-enabled = true
ambient-suggestions-enabled = true
appearanceDarkCodeThemeId = "dracula"
appearanceTheme = "dark"
appshotSoundEnabled = false
avatar-overlay-mascot-width-px = 80
codeFontSize = 14
composerEnterBehavior = "cmdAlways"
composerPlainTextMode = true
conversationDetailMode = "STEPS_COMMANDS"
defaultTerminalLocation = "right"
dock-icon-preference = "app-default"
followUpQueueMode = "steer"
git-branch-prefix = "br3ndonland/"
git-create-pull-request-as-draft = true
git-pr-watch-auto-merge = false
git-pr-watch-instructions = """
For the pull request being watched, autonomously address existing and new review comments from humans and bots.

- Before making changes, verify the repository owner/name, PR number, head branch, current head SHA, and base branch. Work only on that PR's existing branch. Refresh remote state before pushing and preserve teammates' changes.
- Evaluate each comment against the current code. For valid, actionable findings, make focused fixes, run appropriate tests and required checks, commit, and push without asking me to repeat authorization.
- After confirming the fix is pushed, reply to the corresponding review thread with the commit reference and a concise explanation, then resolve that thread. Resolve already-fixed or superseded findings only after verifying them against the current head and explaining why. Leave unresolved or disputed findings open; do not resolve comments merely because GitHub marks them outdated.
- Preserve the PR's current draft/Ready for Review state. Never convert a Ready for Review PR back to draft, including while fixing comments or waiting for CI. Instructions to create new PRs as drafts do not apply to existing PRs.
- After each push, check whether the PR title and description still match the work. If changes are needed, fetch the current body and make targeted edits that preserve others' contributions and metadata.
- If the initial adversarial review has already been completed, do not repeat it for routine review-fix commits unless I explicitly request it.
- Check CI for the latest pushed commit and address failures caused by your changes. Report inaccessible checks or unrelated failures accurately; never claim unverified checks passed.
- Continue watching after fixes are pushed or checks turn green. Stop when the PR is merged or closed, or when I ask you to stop. Do not merge, close, deploy, change PR readiness, or start unrelated work.
- Stay quiet when nothing actionable has changed. Notify me concisely when fixes are pushed, a meaningful blocker needs my input, or monitoring ends. Avoid duplicate replies and notifications.
"""
git-pull-request-merge-method = "squash"
