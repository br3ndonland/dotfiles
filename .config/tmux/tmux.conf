# Keep enough output for searching and copying.
set -g history-limit 100000

# Use Ctrl+T as the prefix. Hold Ctrl and press T twice to enter copy mode.
set -g prefix C-t
unbind C-b
unbind C-Space

# Use the non-Vim copy-mode table with editor-style bindings below.
setw -g mode-keys emacs

# Reduce delay when pressing Escape.
set -s escape-time 10

# Number windows and panes from 1.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Easier splits, inheriting the current pane's directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Replace the old copy-mode entry bindings, including when reloading.
unbind [
unbind Space
bind C-t copy-mode

# Plain movement clears the selection.
bind -T copy-mode Left send -X clear-selection \; send -X cursor-left
bind -T copy-mode Down send -X clear-selection \; send -X cursor-down
bind -T copy-mode Up send -X clear-selection \; send -X cursor-up
bind -T copy-mode Right send -X clear-selection \; send -X cursor-right
bind -T copy-mode Home send -X clear-selection \; send -X start-of-line
bind -T copy-mode End send -X clear-selection \; send -X end-of-line
bind -T copy-mode PPage send -X clear-selection \; send -X page-up
bind -T copy-mode NPage send -X clear-selection \; send -X page-down
bind -T copy-mode C-Home send -X clear-selection \; send -X history-top
bind -T copy-mode C-End send -X clear-selection \; send -X history-bottom

# Shift starts a selection only if one is not already active, preserving its anchor.
bind -T copy-mode S-Left if -F '#{selection_present}' {} { send -X begin-selection } \; send -X cursor-left
bind -T copy-mode S-Down if -F '#{selection_present}' {} { send -X begin-selection } \; send -X cursor-down
bind -T copy-mode S-Up if -F '#{selection_present}' {} { send -X begin-selection } \; send -X cursor-up
bind -T copy-mode S-Right if -F '#{selection_present}' {} { send -X begin-selection } \; send -X cursor-right
bind -T copy-mode S-Home if -F '#{selection_present}' {} { send -X begin-selection } \; send -X start-of-line
bind -T copy-mode S-End if -F '#{selection_present}' {} { send -X begin-selection } \; send -X end-of-line

# Search backward from the cursor, since copy mode usually starts at the bottom.
bind -T copy-mode C-f send -X clear-selection \; command-prompt -T search -p "Find" { send -X search-backward-text "%%" }

# Copy to the local macOS clipboard, or leave without copying.
bind -T copy-mode Enter send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode Escape send -X cancel

# Reload this configuration.
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"
